ly="Arial" font-size="22" font-weight="bold" fill="#172b45">Offline estimation</text><text x="70" y="451" font-family="Arial" font-size="18" fill="#33495f">A/B or shared latency model</text><text x="70" y="478" font-family="Arial" font-size="18" fill="#33495f">C demand forecast; rewrite cost</text><path d="M450 455 H370" fill="none" stroke="#536577" stroke-width="2.5" marker-end="url(#arrow)"/><text x="375" y="438" font-family="Arial" font-size="17" fill="#536577">verified</text><rect x="50" y="650" width="700" height="145" rx="10" fill="#fff3e8" stroke="#60768c" stroke-width="2" stroke-dasharray="9 6"/><text x="70" y="684" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Timing controller</text><text x="70" y="716" font-family="Arial" font-size="18" fill="#33495f">Observe queue, layout and past history → estimate outcomes</text><text x="70" y="743" font-family="Arial" font-size="18" fill="#33495f">Compare start now, wait or defer; refuse unsupported states</text><path d="M210 525 V650" fill="none" stroke="#536577" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="230" y="591" font-family="Arial" font-size="17" fill="#536577">candidate estimates</text><path d="M750 725 H1175 V320 H1050 V290" fill="none" stroke="#536577" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="830" y="705" font-family="Arial" font-size="17" fill="#536577">proposed maintenance trigger</text><text x="50" y="872" font-family="Arial" font-size="20" fill="#172b45">Current evidence: remote execution and exploratory estimators exist. SF10 acceptance, calibration and scheduling benefit remain pending.</text></svg>