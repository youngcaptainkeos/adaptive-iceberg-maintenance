<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#536577"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="50" y="55" font-family="Arial" font-size="32" font-weight="bold" fill="#172b45">Workload-aware maintenance architecture</text><text x="50" y="91" font-family="Arial" font-size="19" fill="#536577">Option A · Recommended overview · Solid = execution and evidence; dashed = proposed learned decision loop</text><rect x="50" y="150" width="320" height="140" rx="10" fill="#eaf2f8" stroke="#60768c" stroke-width="2"/><text x="70" y="184" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Workload inputs</text><text x="70" y="216" font-family="Arial" font-size="18" fill="#33495f">Snowset arrival timestamps</text><text x="70" y="243" font-family="Arial" font-size="18" fill="#33495f">TPC-H tables and SQL templates</text><rect x="450" y="150" width="300" height="140" rx="10" fill="#eaf2f8" stroke="#60768c" stroke-width="2"/><text x="470" y="184" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Replay and FIFO queue</text><text x="470" y="216" font-family="Arial" font-size="18" fill="#33495f">Preserve offered arrival spacing</text><text x="470" y="243" font-family="Arial" font-size="18" fill="#33495f">Record backlog, start and finish</text><rect x="830" y="150" width="320" height="140" rx="10" fill="#eaf2f8" stroke="#60768c" stroke-width="2"/><text x="850" y="184" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Spark SQL + Iceberg</text><text x="850" y="216" font-family="Arial" font-size="18" fill="#33495f">Queries and data-file compaction</text><text x="850" y="243" font-family="Arial" font-size="18" fill="#33495f">Snapshots over Parquet files</text><rect x="1230" y="150" width="320" height="140" rx="10" fill="#