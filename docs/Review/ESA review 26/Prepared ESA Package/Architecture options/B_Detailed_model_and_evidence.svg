layout</text><rect x="1210" y="145" width="340" height="125" rx="10" fill="#fff3e8" stroke="#60768c" stroke-width="2" stroke-dasharray="9 6"/><text x="1230" y="179" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Shared-model comparator</text><text x="1230" y="211" font-family="Arial" font-size="18" fill="#33495f">One estimator + maintenance state</text><text x="1230" y="238" font-family="Arial" font-size="18" fill="#33495f">Same splits and allowed features</text><path d="M390 208 H450" fill="none" stroke="#536577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M220 145 V120 H990 V145" fill="none" stroke="#536577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M990 120 H1380 V145" fill="none" stroke="#536577" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="365" width="340" height="125" rx="10" fill="#eaf2f8" stroke="#60768c" stroke-width="2"/><text x="70" y="399" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Past offered arrivals</text><text x="70" y="431" font-family="Arial" font-size="18" fill="#33495f">Time-ordered Snowset observations</text><text x="70" y="458" font-family="Arial" font-size="18" fill="#33495f">No original production SQL replay</text><rect x="450" y="365" width="320" height="125" rx="10" fill="#fff3e8" stroke="#60768c" stroke-width="2" stroke-dasharray="9 6"/><text x="470" y="399" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">C  Future demand</text><text x="470" y="431" font-family="Arial" font-size="18" fill="#33495f">Predict offered arrival counts</text><text x="470" y="458" font-family="Arial" font-size="18" fill="#33495f">Past-only inputs; explicit horizon</text><path d="M390 427 H450" fill="none" stroke="#536577" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="830" y="365" width="320" height="125" rx="10" fill="#fff3e8" stroke="#60768c" stroke-width="2" stroke-dasharray="9 6"/><text x="850" y="399" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Rewrite / transition estimate</text><text x="850" y="431" font-family="Arial" font-size="18" fill="#33495f">Duration and layout transition</text><text x="850" y="458" font-family="Arial" font-size="18" fill="#33495f">Separate target from query latency</text><rect x="1210" y="365" width="340" height="125" rx="10" fill="#fff3e8" stroke="#60768c" stroke-width="2" stroke-dasharray="9 6"/><text x="1230" y="399" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Decision controller</text><text x="1230" y="431" font-family="Arial" font-size="18" fill="#33495f">Queue + A/B/shared + C + rewrite</text><text x="1230" y="458" font-family="Arial" font-size="18" fill="#33495f">Start now / wait / defer</text><path d="M610 270 V310 H1380 V365" fill="none" stroke="#536577" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 6"/><path d="M610 490 V525 H1200 V455 H1210" fill="none" stroke="#536577" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 6"/><path d="M1150 427 H1210" fill="none" stroke="#536577" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 6"/><rect x="50" y="620" width="720" height="135" rx="10" fill="#eaf2f8" stroke="#60768c" stroke-width="2"/><text x="70" y="654" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Physical execution and measurement</text><text x="70" y="686" font-family="Arial" font-size="18" fill="#33495f">Replay driver → FIFO dispatch → Spark SQL → Iceberg / Parquet</text><text x="70" y="713" font-family="Arial" font-size="18" fill="#33495f">Record offered work, response, compaction progress and residual debt</text><path d="M1380 490 V570 H650 V620" fill="none" stroke="#536577" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="935" y="550" font-family="Arial" font-size="17" fill="#536577">proposed action → real execution</text><rect x="830" y="620" width="720" height="135" rx="10" fill="#eaf2f8" stroke="#60768c" stroke-width="2"/><text x="850" y="654" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Independent evidence gate</text><text x="850" y="686" font-family="Arial" font-size="18" fill="#33495f">Logical correctness + explicit counters + complete task attempts</text><text x="850" y="713" font-family="Arial" font-size="18" fill="#33495f">Raw checksums and source-family splits; failed data excluded</text><path d="M770 688 H830" fill="none" stroke="#536577" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="815" font-family="Arial" font-size="17" fill="#536577">Offline fitting requires audited whole source families; no held-out tuning</text><text x="50" y="925" font-family="Arial" font-size="20" fill="#172b45">A − B is not a causal slowdown estimate. No calibrated interval or scheduler promotion without independent accepted blocks.</text><path d="M990 270 V310 H1380" fill="none" stroke="#536577" stroke-width="2.5" stroke-dasharray="8 6"/><path d="M1380 270 V365" fill="none" stroke="#536577" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/></svg>