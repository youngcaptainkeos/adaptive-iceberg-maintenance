height="120" rx="10" fill="#eaf2f8" stroke="#60768c" stroke-width="2"/><text x="1090" y="189" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Frozen experiment protocol</text><text x="1090" y="221" font-family="Arial" font-size="18" fill="#33495f">Source IDs, layouts, horizon and hashes</text><rect x="230" y="350" width="340" height="120" rx="10" fill="#eaf2f8" stroke="#60768c" stroke-width="2"/><text x="250" y="384" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Replay and FIFO ledger</text><text x="250" y="416" font-family="Arial" font-size="18" fill="#33495f">Offered → queued → dispatched</text><rect x="650" y="350" width="340" height="120" rx="10" fill="#eaf2f8" stroke="#60768c" stroke-width="2"/><text x="670" y="384" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Spark queries + rewrite</text><text x="670" y="416" font-family="Arial" font-size="18" fill="#33495f">Iceberg metadata; Parquet data</text><rect x="1070" y="350" width="450" height="120" rx="10" fill="#eaf2f8" stroke="#60768c" stroke-width="2"/><text x="1090" y="384" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Observed response and layout</text><text x="1090" y="416" font-family="Arial" font-size="18" fill="#33495f">Wait + service; final files and remaining work</text><path d="M400 275 V350" fill="none" stroke="#536577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M820 275 V350" fill="none" stroke="#536577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M570 410 H650" fill="none" stroke="#536577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M990 410 H1070" fill="none" stroke="#536577" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="230" y="545" width="340" height="120" rx="10" fill="#eaf2f8" stroke="#60768c" stroke-width="2"/><text x="250" y="579" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Raw observation archive</text><text x="250" y="611" font-family="Arial" font-size="18" fill="#33495f">Host counters; SQL / job / task links</text><rect x="650" y="545" width="340" height="120" rx="10" fill="#eaf2f8" stroke="#60768c" stroke-width="2"/><text x="670" y="579" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Correctness and audit gates</text><text x="670" y="611" font-family="Arial" font-size="18" fill="#33495f">Missing evidence stays missing</text><rect x="1070" y="545" width="450" height="120" rx="10" fill="#eaf2f8" stroke="#60768c" stroke-width="2"/><text x="1090" y="579" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Accepted family-based datasets</text><text x="1090" y="611" font-family="Arial" font-size="18" fill="#33495f">Whole episodes; no random-row leakage</text><path d="M820 470 V510 H400 V545" fill="none" stroke="#536577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M570 605 H650" fill="none" stroke="#536577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M990 605 H1070" fill="none" stroke="#536577" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="230" y="740" width="340" height="120" rx="10" fill="white" stroke="#60768c" stroke-width="2" stroke-dasharray="9 6"/><text x="250" y="774" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Offline A/B/shared and C</text><text x="250" y="806" font-family="Arial" font-size="18" fill="#33495f">Compare with medians / persistence</text><rect x="650" y="740" width="340" height="120" rx="10" fill="white" stroke="#60768c" stroke-width="2" stroke-dasharray="9 6"/><text x="670" y="774" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Rewrite-cost estimate</text><text x="670" y="806" font-family="Arial" font-size="18" fill="#33495f">Real duration and layout targets</text><rect x="1070" y="740" width="450" height="120" rx="10" fill="white" stroke="#60768c" stroke-width="2" stroke-dasharray="9 6"/><text x="1090" y="774" font-family="Arial" font-size="22" font-weight="bold" fill="#172b45">Future timing policy</text><text x="1090" y="806" font-family="Arial" font-size="18" fill="#33495f">Evidence-gated feedback to execution</text><path d="M1295 665 V705 H400 V740" fill="none" stroke="#536577" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="50" y="955" font-family="Arial" font-size="19" fill="#536577">Dashed decision lane: exploratory or planned integration. It does not certify a working learned scheduler.</text><path d="M820 705 V740" stroke="#536577" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#arrow)"/><path d="M400 860 V900 H1295 V860" stroke="#536577" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#arrow)"/><path d="M820 860 V880 H1295" stroke="#536577" stroke-width="2.5" stroke-dasharray="8 6" fill="none"/><path d="M1520 800 H1555 V500 H820 V470" stroke="#536577" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#arrow)"/></svg>