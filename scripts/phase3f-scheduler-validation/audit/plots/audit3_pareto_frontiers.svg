<svg width="700" height="420" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="350" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Audit 3: Pareto Frontier (SLA Violation Rate vs Maintenance Completion Rate)</text>
  
  <!-- Axes -->
  <line x1="80" y1="340" x2="640" y2="340" stroke="#cccccc" stroke-width="1.5"/>
  <line x1="80" y1="340" x2="80" y2="60" stroke="#cccccc" stroke-width="1.5"/>

  <!-- Axis Titles -->
  <text x="360" y="385" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333333">Maintenance Completion Rate (%) →</text>
  <text x="25" y="200" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333333" transform="rotate(-90 25 200)">SLA Violation Rate (%) ↑</text>

  <!-- Y ticks (0 to 30%) -->
  <text x="70" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" text-anchor="end" fill="#666666">0%</text>
  <text x="70" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" text-anchor="end" fill="#666666">10%</text>
  <text x="70" y="155" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" text-anchor="end" fill="#666666">20%</text>
  <text x="70" y="60" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" text-anchor="end" fill="#666666">30%</text>

  <!-- X ticks (30% to 100%) -->
  <text x="80" y="360" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">30%</text>
  <text x="240" y="360" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">50%</text>
  <text x="440" y="360" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">75%</text>
  <text x="640" y="360" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">100%</text>
  <line x1="40.0" y1="340.0" x2="50.0" y2="340.0" stroke="#2b5c8f" stroke-width="2" stroke-dasharray="4"/>
  <line x1="50.0" y1="340.0" x2="50.0" y2="340.0" stroke="#2b5c8f" stroke-width="2" stroke-dasharray="4"/>
  <line x1="50.0" y1="340.0" x2="640.0" y2="-56.666666666666686" stroke="#2b5c8f" stroke-width="2" stroke-dasharray="4"/>
  <circle cx="640.0" cy="-56.666666666666686" r="7" fill="#2b5c8f"/>
  <text x="650.0" y="-61.666666666666686" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#2b5c8f">K=0 (100.0%, 42.5%)</text>
  <circle cx="50.0" cy="340.0" r="7" fill="#2b5c8f"/>
  <text x="60.0" y="335.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#2b5c8f">K=1 (26.2%, 0.0%)</text>
  <circle cx="40.0" cy="340.0" r="7" fill="#2b5c8f"/>
  <text x="50.0" y="335.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#2b5c8f">K=2 (25.0%, 0.0%)</text>
  <circle cx="50.0" cy="340.0" r="7" fill="#2b5c8f"/>
  <text x="60.0" y="335.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#2b5c8f">K=3 (26.2%, 0.0%)</text>
  <circle cx="20.0" cy="340.0" r="5" fill="#d95f02"/>
  <text x="30.0" y="335.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#d95f02">K=4 (22.5%, 0.0%)</text>
  <circle cx="50.0" cy="340.0" r="5" fill="#d95f02"/>
  <text x="60.0" y="335.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#d95f02">K=5 (26.2%, 0.0%)</text>
  <!-- Legend -->
  <circle cx="450" y="80" r="6" fill="#2b5c8f"/>
  <text x="465" y="84" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#333333">Pareto-Optimal Frontier</text>
  <circle cx="450" y="105" r="5" fill="#d95f02"/>
  <text x="465" y="109" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#333333">Dominated Operating Point</text>
</svg>