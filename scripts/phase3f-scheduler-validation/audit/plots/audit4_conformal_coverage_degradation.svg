<svg width="720" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="360" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Audit 4: Conformal Prediction Coverage Breakdown Across Domain Regimes</text>
  
  <!-- Nominal 95% Target Line -->
  <line x1="80" y1="90" x2="660" y2="90" stroke="#d95f02" stroke-width="2" stroke-dasharray="6"/>
  <text x="665" y="94" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#d95f02">Target: 95.0%</text>

  <!-- Grid Lines -->
  <line x1="80" y1="320" x2="640" y2="320" stroke="#cccccc" stroke-width="1"/>
  <line x1="80" y1="245" x2="640" y2="245" stroke="#eeeeee" stroke-width="1"/>
  <line x1="80" y1="170" x2="640" y2="170" stroke="#eeeeee" stroke-width="1"/>

  <!-- Y-Axis Labels -->
  <text x="70" y="325" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" text-anchor="end" fill="#666666">0%</text>
  <text x="70" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" text-anchor="end" fill="#666666">30%</text>
  <text x="70" y="175" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" text-anchor="end" fill="#666666">60%</text>
  <text x="70" y="100" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" text-anchor="end" fill="#666666">90%</text>

  <!-- Bars -->
  <rect x="115" y="70.0" width="70" height="250.0" fill="#2b5c8f" rx="4"/>
  <text x="150" y="62.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2b5c8f">100.0%</text>
  <text x="150" y="342" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">In-Distribution</text>
  <text x="150" y="360" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">N=168</text>
  <rect x="255" y="70.0" width="70" height="250.0" fill="#2b5c8f" rx="4"/>
  <text x="290" y="62.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2b5c8f">100.0%</text>
  <text x="290" y="342" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">Interpolation Domain</text>
  <text x="290" y="360" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">N=80</text>
  <rect x="395" y="70.0" width="70" height="250.0" fill="#2b5c8f" rx="4"/>
  <text x="430" y="62.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2b5c8f">100.0%</text>
  <text x="430" y="342" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">20-File Extrapolation</text>
  <text x="430" y="360" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">N=40</text>
  <rect x="535" y="220.0" width="70" height="100.0" fill="#e7298a" rx="4"/>
  <text x="570" y="212.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#e7298a">40.0%</text>
  <text x="570" y="342" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">750-File Extrapolation</text>
  <text x="570" y="360" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">N=40</text>
  <line x1="80" y1="320" x2="80" y2="60" stroke="#cccccc" stroke-width="1"/>
</svg>