<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450">
<style>
.yes { fill: #27ae60; }
.no { fill: #c0392b; }
.text { font-family: Arial; font-size: 13px; fill: #333; }
.title { font-family: Arial; font-size: 16px; font-weight: bold; }
</style>
<text x="20" y="30" class="title">Audit 7: Physical Experiment Phenomenological Readiness</text>
<text x="20" y="75" class="text">Persistent Iceberg State</text>
<rect x="250" y="60" width="100" height="22" rx="4" class="yes"/>
<text x="255" y="75" class="text" fill="white">Measure: Yes</text>
<text x="370" y="75" class="text">Constraint: None</text>
<text x="20" y="115" class="text">Evolving Fragmentation</text>
<rect x="250" y="100" width="100" height="22" rx="4" class="yes"/>
<text x="255" y="115" class="text" fill="white">Measure: Yes</text>
<text x="370" y="115" class="text">Constraint: Depends on Workload Write Intensity</text>
<text x="20" y="155" class="text">Continuous Query Arrivals</text>
<rect x="250" y="140" width="100" height="22" rx="4" class="yes"/>
<text x="255" y="155" class="text" fill="white">Measure: Yes</text>
<text x="370" y="155" class="text">Constraint: Managed by NHPP simulator</text>
<text x="20" y="195" class="text">Workload Transitions</text>
<rect x="250" y="180" width="100" height="22" rx="4" class="yes"/>
<text x="255" y="195" class="text" fill="white">Measure: Yes</text>
<text x="370" y="195" class="text">Constraint: Regimes will cycle multiple times over 4-8h</text>
<text x="20" y="235" class="text">Real Spark Telemetry</text>
<rect x="250" y="220" width="100" height="22" rx="4" class="yes"/>
<text x="255" y="235" class="text" fill="white">Measure: Yes</text>
<text x="370" y="235" class="text">Constraint: Needs robust REST API parsing in global daemon</text>
<text x="20" y="275" class="text">Real Compaction Events</text>
<rect x="250" y="260" width="100" height="22" rx="4" class="yes"/>
<text x="255" y="275" class="text" fill="white">Measure: Yes</text>
<text x="370" y="275" class="text">Constraint: Requires programmatic trigger threshold</text>
<text x="20" y="315" class="text">Overlap (Interference)</text>
<rect x="250" y="300" width="100" height="22" rx="4" class="yes"/>
<text x="255" y="315" class="text" fill="white">Measure: Yes</text>
<text x="370" y="315" class="text">Constraint: Requires queries to be queued/running during compaction</text>
<text x="20" y="355" class="text">Unified Timestamps</text>
<rect x="250" y="340" width="100" height="22" rx="4" class="yes"/>
<text x="255" y="355" class="text" fill="white">Measure: Yes</text>
<text x="370" y="355" class="text">Constraint: Time.time() epoch in Python Daemon</text>
<text x="20" y="395" class="text">Hardware Cache State</text>
<rect x="250" y="380" width="100" height="22" rx="4" class="no"/>
<text x="255" y="395" class="text" fill="white">Measure: No</text>
<text x="370" y="395" class="text">Constraint: OS level caches (page cache) are unobservable directly</text>
<text x="20" y="435" class="text">Network Latency Fluctuations</text>
<rect x="250" y="420" width="100" height="22" rx="4" class="no"/>
<text x="255" y="435" class="text" fill="white">Measure: No</text>
<text x="370" y="435" class="text">Constraint: Not instrumented in daemon</text>
</svg>
