<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250">
<style>
.sel { fill: #27ae60; }
.rej { fill: #c0392b; }
.warn { fill: #f39c12; }
.text { font-family: Arial; font-size: 13px; fill: #333; }
.title { font-family: Arial; font-size: 16px; font-weight: bold; }
</style>
<text x="20" y="30" class="title">Audit 6: Temporal Split Protocol Selection</text>
<text x="20" y="75" class="text">A. Random Window Split</text>
<rect x="350" y="60" width="250" height="22" rx="4" class="rej"/>
<text x="355" y="75" class="text" fill="white">Rejected (Lookback overlaps)</text>
<text x="620" y="75" class="text">Leakage Risk: Extreme | Realism: None</text>
<text x="20" y="115" class="text">B. Chronological Split (e.g. 70/15/15)</text>
<rect x="350" y="100" width="250" height="22" rx="4" class="sel"/>
<text x="355" y="115" class="text" fill="white">SELECTED (Strict timeline preservation)</text>
<text x="620" y="115" class="text">Leakage Risk: None | Realism: High</text>
<text x="20" y="155" class="text">C. Blocked Temporal Split (k-fold time series)</text>
<rect x="350" y="140" width="250" height="22" rx="4" class="rej"/>
<text x="355" y="155" class="text" fill="white">Rejected (Requires discarding gap buffers)</text>
<text x="620" y="155" class="text">Leakage Risk: Moderate | Realism: Moderate</text>
<text x="20" y="195" class="text">D. Episode-Level Split</text>
<rect x="350" y="180" width="250" height="22" rx="4" class="warn"/>
<text x="355" y="195" class="text" fill="white">Secondary/Optional (Depends on distinct episodes)</text>
<text x="620" y="195" class="text">Leakage Risk: None | Realism: Very High</text>
<text x="20" y="235" class="text">E. Future-Distribution Shift Test</text>
<rect x="350" y="220" width="250" height="22" rx="4" class="sel"/>
<text x="355" y="235" class="text" fill="white">Recommended for Final Holdout</text>
<text x="620" y="235" class="text">Leakage Risk: None | Realism: Extreme</text>
</svg>
