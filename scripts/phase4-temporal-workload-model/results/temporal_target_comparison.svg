<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250">
<style>
.sel { fill: #27ae60; }
.rej { fill: #c0392b; }
.text { font-family: Arial; font-size: 13px; fill: #333; }
.title { font-family: Arial; font-size: 16px; font-weight: bold; }
</style>
<text x="20" y="30" class="title">Audit 3: Target Selection Analysis</text>
<text x="20" y="75" class="text">1. Point QIR at t+h</text>
<rect x="250" y="60" width="120" height="22" rx="4" class="rej"/>
<text x="255" y="75" class="text" fill="white">Rejected</text>
<text x="390" y="75" class="text">Repr: Low | Noise: High</text>
<text x="20" y="115" class="text">2. Mean QIR over [t, t+h]</text>
<rect x="250" y="100" width="120" height="22" rx="4" class="sel"/>
<text x="255" y="115" class="text" fill="white">SELECTED</text>
<text x="390" y="115" class="text">Repr: High | Noise: Low</text>
<text x="20" y="155" class="text">3. Max QIR over [t, t+h]</text>
<rect x="250" y="140" width="120" height="22" rx="4" class="rej"/>
<text x="255" y="155" class="text" fill="white">Rejected</text>
<text x="390" y="155" class="text">Repr: Moderate | Noise: High</text>
<text x="20" y="195" class="text">4. 95th Percentile QIR</text>
<rect x="250" y="180" width="120" height="22" rx="4" class="rej"/>
<text x="255" y="195" class="text" fill="white">Rejected</text>
<text x="390" y="195" class="text">Repr: Moderate | Noise: Moderate</text>
<text x="20" y="235" class="text">5. SLA Violation Indicator</text>
<rect x="250" y="220" width="120" height="22" rx="4" class="rej"/>
<text x="255" y="235" class="text" fill="white">Rejected</text>
<text x="390" y="235" class="text">Repr: Low | Noise: Low</text>
</svg>
