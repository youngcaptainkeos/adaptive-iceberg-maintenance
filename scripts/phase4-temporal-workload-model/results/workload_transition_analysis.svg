<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250">
<style>
.bar { fill: #3498db; }
.text { font-family: Arial; font-size: 13px; fill: #333; }
.title { font-family: Arial; font-size: 16px; font-weight: bold; }
</style>
<text x="20" y="30" class="title">Audit 5: Workload Regime Transitions</text>
<text x="20" y="75" class="text">LOW -> MODERATE</text>
<rect x="250" y="60" width="300.0" height="20" class="bar"/>
<text x="555.0" y="75" class="text">3 times (Avg 618s)</text>
<text x="20" y="115" class="text">MODERATE -> LOW</text>
<rect x="250" y="100" width="200.0" height="20" class="bar"/>
<text x="455.0" y="115" class="text">2 times (Avg 520s)</text>
<text x="20" y="155" class="text">MODERATE -> HIGH</text>
<rect x="250" y="140" width="400.0" height="20" class="bar"/>
<text x="655.0" y="155" class="text">4 times (Avg 520s)</text>
<text x="20" y="195" class="text">HIGH -> MODERATE</text>
<rect x="250" y="180" width="300.0" height="20" class="bar"/>
<text x="555.0" y="195" class="text">3 times (Avg 453s)</text>
<text x="20" y="235" class="text">HIGH -> LOW</text>
<rect x="250" y="220" width="100.0" height="20" class="bar"/>
<text x="355.0" y="235" class="text">1 times (Avg 453s)</text>
</svg>
